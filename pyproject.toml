[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hussein"
version = "3.0.0"
description = "Hussein"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Hussein"}]

dependencies = [
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
    "colorama>=0.4.6",
]

[project.scripts]
hussein = "hussein:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hussein*"]
